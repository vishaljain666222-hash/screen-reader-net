name: screenreader_academy
description: "Learn NVDA, JAWS and Narrator - an accessible screen reader training app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence (v1 on-device accounts, quiz scores, progress)
  shared_preferences: ^2.3.2

  # Password hashing for the local v1 auth store
  crypto: ^3.0.5

  # --- Not used in v1, but kept here as the upgrade path for real Google
  # Sign-In once a Firebase project is set up (see README.md). Uncomment
  # when ready:
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # google_sign_in: ^6.2.1
  # cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
