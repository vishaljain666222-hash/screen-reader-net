name: screenreader_academy
description: "Accessible AI Academy - browse, learn about, and purchase professional skill-development courses."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence (on-device accounts, wishlist, accessibility settings,
  # buy-now/notify-me demand tracking)
  shared_preferences: ^2.3.2

  # Password hashing for the local auth store
  crypto: ^3.0.5

  # In-app update checking (asks GitHub Releases for the latest version)
  http: ^1.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # Share button on the Course Detail screen
  share_plus: ^10.1.2

  # Free Accessible Tools: text-to-speech reader + talking calculator
  flutter_tts: ^4.2.0

  # AI Text Summarizer: attach .txt / .pdf files to summarize
  file_picker: ^10.3.10
  read_pdf_text: ^0.3.1

  # --- Not used yet, but kept here as the upgrade path for real Google
  # Sign-In once a Firebase project is set up (see README.md). Uncomment
  # when ready:
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # google_sign_in: ^6.2.1
  # cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
