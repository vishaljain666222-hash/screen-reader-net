name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users, e.g. 1.0.1'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Internal build number — must be higher than the last release'
        required: true
        default: '1'
      release_notes:
        description: "What's new in this update (shown to users)"
        required: false
        default: 'Bug fixes and improvements.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter packages
        run: flutter pub get

      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.screenreaderacademy.app .

      - name: Get Flutter packages again (post-scaffold)
        run: flutter pub get

      - name: Set Android app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Accessible AI Academy"/' android/app/src/main/AndroidManifest.xml

      - name: Ensure internet permission is declared
        run: |
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />#' android/app/src/main/AndroidManifest.xml
          fi
          echo "--- AndroidManifest.xml permissions check ---"
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || echo "WARNING: no uses-permission lines found"

      - name: Force a modern compileSdk/targetSdk for newer plugin dependencies
        run: |
          GRADLE_FILE=android/app/build.gradle
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE=android/app/build.gradle.kts
          sed -i 's/flutter\.compileSdkVersion/36/' "$GRADLE_FILE"
          sed -i 's/flutter\.targetSdkVersion/36/' "$GRADLE_FILE"
          grep -n "compileSdk\|targetSdk" "$GRADLE_FILE"

      - name: Add ProGuard rules for read_pdf_text's optional dependencies
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro <<'EOF'
          # PdfBox-Android (used by read_pdf_text) references several optional,
          # format-specific decoder classes that aren't bundled by default.
          # R8 fails release builds unless told to ignore these.
          -dontwarn com.gemalto.jp2.**
          -dontwarn com.tom_roush.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.osgi.**
          EOF
          echo "--- proguard-rules.pro ---"
          cat android/app/proguard-rules.pro

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing in Gradle
        run: python3 scripts/patch_build_gradle.py

      - name: Set app version
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build signed release APK
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee /tmp/build_log.txt

      - name: Save build log on failure
        if: failure()
        run: |
          tail -c 60000 /tmp/build_log.txt > /tmp/debug_build_log.txt 2>/dev/null || echo "no build log captured" > /tmp/debug_build_log.txt
          echo "--- flutter-apk output dir ---" >> /tmp/debug_build_log.txt
          ls -la build/app/outputs/flutter-apk/ 2>&1 >> /tmp/debug_build_log.txt || true
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          with open("/tmp/debug_build_log.txt", "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode()

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }
          url = f"https://api.github.com/repos/{repo}/contents/debug_build_log.txt"

          sha = None
          try:
              req = urllib.request.Request(url + "?ref=main", headers=headers)
              with urllib.request.urlopen(req) as resp:
                  sha = json.loads(resp.read())["sha"]
          except Exception:
              pass

          body = {"message": "CI: save build log after failure [skip ci]", "content": content_b64, "branch": "main"}
          if sha:
              body["sha"] = sha

          req = urllib.request.Request(
              url, data=json.dumps(body).encode(), method="PUT", headers=headers
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Saved debug log, status:", resp.status)
          except Exception as e:
              print("Failed to save debug log:", e)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Rename APK for clarity
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/screenreader-academy.apk

      - name: Upload build artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: screenreader-academy-apk
          path: build/app/outputs/flutter-apk/screenreader-academy.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Version ${{ env.VERSION_NAME }}
          body: ${{ github.event.inputs.release_notes || 'Bug fixes and improvements.' }}
          files: build/app/outputs/flutter-apk/screenreader-academy.apk
