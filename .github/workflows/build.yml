name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users, e.g. 1.0.1'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Internal build number — must be higher than the last release'
        required: true
        default: '1'
      release_notes:
        description: "What's new in this update (shown to users)"
        required: false
        default: 'Bug fixes and improvements.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter packages
        run: flutter pub get

      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.screenreaderacademy.app .

      - name: Get Flutter packages again (post-scaffold)
        run: flutter pub get

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing in Gradle
        run: python3 scripts/patch_build_gradle.py

      - name: Set app version
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Rename APK for clarity
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/screenreader-academy.apk

      - name: Upload build artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: screenreader-academy-apk
          path: build/app/outputs/flutter-apk/screenreader-academy.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Version ${{ env.VERSION_NAME }}
          body: ${{ github.event.inputs.release_notes || 'Bug fixes and improvements.' }}
          files: build/app/outputs/flutter-apk/screenreader-academy.apk
